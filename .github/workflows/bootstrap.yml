name: bootstrap

# The bootstrap is Windows-only PowerShell, so it cannot be checked anywhere it
# is written. This runs it on a real Windows machine that has nothing set up,
# which is exactly the case it exists for.
# It also runs the four suites, and those cover code that cannot even be
# imported on Linux (ctypes.WinDLL), so any Python change has to come through
# here too — otherwise the engine and the UI ship unverified on the one
# platform they run on.
on:
  push:
    paths:
      - "**/*.py"
      - "tools/setup.ps1"
      - "Start.bat"
      - "requirements.txt"
      - ".github/workflows/bootstrap.yml"
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 reads a .ps1 as ANSI unless it carries a UTF-8
      # BOM, so a single em dash in a comment is a parse error on the shell every
      # machine actually has — while pwsh 7 reads the same file happily. Keeping
      # the scripts to plain ASCII removes the whole class, and this is the guard.
      - name: The scripts are pure ASCII
        shell: pwsh
        run: |
          $bad = @()
          foreach ($file in @("tools/setup.ps1", "Start.bat", "run.bat")) {
            $bytes = [System.IO.File]::ReadAllBytes($file)
            $offset = 0
            foreach ($byte in $bytes) {
              if ($byte -gt 127) { $bad += "${file}: byte 0x{0:X2} at offset $offset" -f $byte }
              $offset++
            }
          }
          if ($bad) {
            $bad | Select-Object -First 10 | ForEach-Object { Write-Error $_ }
            Write-Error "non-ASCII bytes break Windows PowerShell 5.1"
            exit 1
          }
          Write-Host "ASCII only"

      - name: The script parses under PowerShell 7
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/setup.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      # the one that matters: this is the shell Start.bat invokes
      - name: The script parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools\setup.ps1"), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }

      - name: Report what a fresh machine looks like
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/setup.ps1 -CheckOnly

      - name: Set up, without launching
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/setup.ps1

      - name: The app's dependencies really are installed
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "import PySide6; print('PySide6', PySide6.__version__)"

      - name: The window builds under the interpreter the bootstrap chose
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\.venv\Scripts\python.exe -c @"
          from PySide6.QtWidgets import QApplication
          from arkmacro.ui.main_window import MainWindow, NAV
          from arkmacro.ui.theme import QSS
          app = QApplication([])
          app.setStyleSheet(QSS)
          window = MainWindow()
          assert window.stack.count() == len(NAV)
          window.hotkeys.stop()
          window.close()
          print('the app starts on a machine set up from nothing')
          "@

      - name: A second run reuses what the first one built
        shell: pwsh
        run: |
          $before = (Get-Item .venv\.requirements-hash).LastWriteTimeUtc
          powershell -ExecutionPolicy Bypass -File tools/setup.ps1
          $after = (Get-Item .venv\.requirements-hash).LastWriteTimeUtc
          if ($before -ne $after) {
            Write-Error "the second run reinstalled dependencies it already had"
            exit 1
          }
          Write-Host "second run was a no-op, as it should be"

      - name: The test suite passes on Windows
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          foreach ($suite in @("test_engine", "test_ui", "test_updater", "test_winapi")) {
            Write-Host "--- $suite"
            .\.venv\Scripts\python.exe "tests/$suite.py"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
